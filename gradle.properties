# The plugin version (yyyy.mm.NNNN) is kept in version.properties by build.gradle.kts.

# The plugin's GitHub repository: the description's images (README.md's screenshots) load from its master branch.
pluginRepositoryUrl = https://github.com/prituladima/cobra_torch

# IntelliJ IDEA the plugin is compiled against. The plugin declares no upper IDE build,
# so it keeps loading after IDE updates; `./gradlew verifyPlugin` checks it against recent IDEs.
platformVersion = 2026.2.3
pluginSinceBuild = 262

# Python plugin from JetBrains Marketplace (id PythonCore): the Python language, for the logos next to imports.
# Must match platformVersion's build (IU-262.10968.63).
pythonPluginVersion = 262.10968.63

# JSch (com.github.mwiede:jsch), the SSH client for the remote computer.
jschVersion = 2.28.8

# OSHI (com.github.oshi:oshi-core) for the system monitor. 6.9.0 is the last release built for JNA 5.17,
# the JNA of IntelliJ 2026.2; newer IDEs ship newer, compatible JNA.
oshiVersion = 6.9.0

# IntelliJ Platform 2026.x is compiled for Java 25.
javaVersion = 25

org.gradle.configuration-cache = true
org.gradle.caching = true
